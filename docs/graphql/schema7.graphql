"""
Polymorphic union for content within a topic feed.
"""
union TopicEntryContent = AIInsight | AIJob | Workflow | Message

type Topic implements Node & SystemMetadata & Shareable
  @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
  
  parentId: ID!
  name: String!
  
  """
  If set, all entries in this topic should adhere to this template's outputSchema.
  """
  schemaTemplate: PromptTemplate
  
  entryCount: Int!
  entries(
    since: AWSDateTime
    filter: TopicEntryFilterInput
    limit: Int
    nextToken: String
  ): TopicEntryConnection!
}

type TopicEntry implements Node & SystemMetadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  
  topic: Topic!
  projectId: ID
  publishedAt: AWSDateTime!
  
  """
  The primary content entity (Insight, Message, etc).
  """
  content: TopicEntryContent
  
  """
  Structured data adhering to the Topic's schemaTemplate.
  Replaces opaque 'structuredData' JSON.
  """
  dataProperties: [PropertyValue!]!
  
  tags: [String!]
}

type Message implements Node & SystemMetadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
