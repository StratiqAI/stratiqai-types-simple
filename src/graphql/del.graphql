mutation createPrompt {
  createPrompt(
    input: {
      name: "Test Prompt"
      model: GEMINI_3_1_FLASH_PREVIEW
      prompt: "Extract information about the brokers in this document"
      jsonSchemaId: "PASTE_JSON_SCHEMA_ID_HERE"
    }
  ) {
    id
    name
    model
    version
    updatedAt
    tenantId
    sharingMode
    ownerId
    jsonSchemaId
    isActive
    inputVariables
    entityType
    description
    deletedAt
    createdAt
  }
}

mutation createAIQueryExecution {
  createAIQueryExecution(
    input: {
      projectId: "aeb6ad89-9453-40a5-8a71-857f97e883a4"
      executionId: "1b7c4120-4b61-44c7-b26d-21e2330e44e3"
      promptId: "2b7c4120-4b61-44c7-b26d-21e2330e44e4"
      inputValues: "{}"
    }
  ) {
    id
    inputValues
    executionId
    promptId
    status
    candidatesTokenCount
    createdAt
    deletedAt
    documentIds
    durationMs
    entityType
    errorMessage
    executedAt
    ownerId
    projectId
    rawOutput
    promptTokenCount
    tenantId
    topK
    topKPerNs
    totalTokenCount
    updatedAt
  }
}
