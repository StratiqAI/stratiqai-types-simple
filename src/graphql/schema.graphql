"""
AI Studio prompt (formerly PromptTemplate). Versioned instruction set for the AI.
Root entity: accessible by any project and any user. User-owned copies link via sourcePromptId.
"""
type Prompt implements Node & Metadata & Shareable
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection

  """
  When set, this prompt is a user-owned copy forked from another (the original remains shared).
  """
  sourcePromptId: ID
  name: String!
  description: String
  """
  Structured content (body, systemInstruction). Execution uses content.body and content.systemInstruction with variable substitution.
  """
  content: PromptContent!
  """
  Read-only; derived from content.body when possible.
  """
  inputVariables: [String!]
  model: AIModel!
  config: GeminiConfig
  """
  Server-managed version number; reserved for future use.
  """
  version: Int
  """
  When false, prompt may be excluded from lists or execution; reserved for future use.
  """
  isActive: Boolean
  """
  Structured output schema for this prompt (inline). Defines the structure expected from the AI.
  """
  outputSchema: PromptOutputSchema
}

"""
Structured output schema for a prompt (inline object). Defines the structure expected from the AI.
Maps to Gemini responseSchema.
"""
type PromptOutputSchema
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  name: String!
  description: String
  """
  JSON Schema definition (OpenAPI 3.0 compatible). Used to validate AI output.
  """
  schemaDefinition: AWSJSON!
}

type PromptConnection
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  items: [Prompt!]!
  nextToken: String
}

"""
Immutable record of an AI prompt run and its result.
"""
type AIQueryExecution implements Node & Metadata
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  """
  Node & Metadata fields
  """
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  """
  Project fields
  """
  projectId: ID! # Every AI execution is associated with a project.
  """
  AI Query fields
  """
  executionId: ID! # Unique identifier created by the client to track the execution.
  promptId: ID! # ID of the prompt used for this execution.
  """
  Prompt input fields
  """
  inputValues: AWSJSON! # Every prompt has input variables that are passed to the prompt.
  documentIds: [ID] # IDs of the documents for the visual RAG
  topK: Int # Number of documents to return from the visual RAG.
  topKPerNs: Int # Number of documents to return from each namespace in the visual RAG.
  """
  AI Auditing Fields
  """
  executedAt: AWSDateTime # Set when execution completes (null while PENDING/PROCESSING).
  durationMs: Int # Duration in ms when execution completes (null while PENDING/PROCESSING).
  rawOutput: String # Raw output from the AI.
  promptTokenCount: Int # Number of tokens used by the prompt.
  candidatesTokenCount: Int # Number of tokens used by the candidates.
  totalTokenCount: Int # Total number of tokens used by the execution.
  status: ExecutionStatus! # Status of the execution.
  errorMessage: String # Error message if the execution failed.
}

type AIQueryExecutionConnection
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  items: [AIQueryExecution!]!
  nextToken: String
}

