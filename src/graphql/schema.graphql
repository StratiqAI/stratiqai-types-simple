schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ----------------------------------------------------------------------
# 1. SCALARS & DIRECTIVES
# ----------------------------------------------------------------------

scalar AWSDateTime
scalar AWSJSON

directive @aws_iam on OBJECT | FIELD_DEFINITION
directive @aws_cognito_user_pools(
  cognito_groups: [String!]
) on OBJECT | FIELD_DEFINITION
directive @aws_auth(cognito_groups: [String!]) on FIELD_DEFINITION
directive @aws_subscribe(mutations: [String!]) on FIELD_DEFINITION
directive @oneOf on INPUT_OBJECT

# ----------------------------------------------------------------------
# 2. ENUMS
# ----------------------------------------------------------------------

enum EntityType {
  PROJECT
  DOCLINK
  TOPIC
  RESOURCE_SHARE
  NOTIFICATION
  IMAGE
  TABLE
  TEXT
  SCAN
}

enum ProjectStatus {
  ACTIVE
  ARCHIVED
  DELETED
}

enum DoclinkStatus {
  NOT_UPLOADED
  UPLOADED
  PROCESSING
  READY
  FAILED
}

enum SharingMode {
  PRIVATE
  SPECIFIC_USERS
  TENANT_VIEW
  TENANT_EDIT
}

enum SharePermission {
  VIEW
  EDIT
  ADMIN
}

enum ListScope {
  OWNED_BY_ME
  SHARED_WITH_ME
  ALL_TENANT
}

# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

interface Node {
  id: ID!
}

interface Metadata {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

interface Storable {
  s3Bucket: String!
  s3Key: String!
}

# ----------------------------------------------------------------------
# 4. BASE ENTITY TYPES
# ----------------------------------------------------------------------

"""
Composite Key for accessing Child Entities (Doclink, Topic, Image, Table, Text, Scan).
Required because we do not have a Global Lookup GSI for children;
we must know the parentId to locate the item in the Main Table.
"""
input CompositeKeyInput {
  id: ID!
  parentId: ID!
}

type ResourceShare implements Node & Metadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  recipientUserId: ID!
  permission: SharePermission!
  resourceTitle: String!
  resourceType: EntityType!
}

type ResourceShareConnection {
  items: [ResourceShare!]!
  nextToken: String
}

# ----------------------------------------------------------------------
# 5. CHILD ENTITIES (Doclink & Topic)
# ----------------------------------------------------------------------

type Topic implements Node & Metadata & Shareable
  @aws_iam
  @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection

  parentId: ID!
  name: String!
}

type TopicConnection {
  items: [Topic!]!
  nextToken: String
}

type Doclink implements Node & Metadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  parentId: ID!
  filename: String!
  status: DoclinkStatus!
  documentId: ID!
}

type DoclinkConnection {
  items: [Doclink!]!
  nextToken: String
}

type Notification implements Node & Metadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  parentId: ID!
  message: String!
  properties: AWSJSON
}

type NotificationConnection {
  items: [Notification!]!
  nextToken: String
}

# ----------------------------------------------------------------------
# 5B. DOCUMENT CHILD ENTITIES (Image, Table, Text)
# ----------------------------------------------------------------------

type Image implements Node & Metadata & Storable
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Storable Fields
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int

  # Image-specific Fields
  parentId: ID! # Document ID
  pageNum: Int!
  imageId: String! # Original image identifier (e.g., "img-20.jpeg")
  topLeftX: Int!
  topLeftY: Int!
  bottomRightX: Int!
  bottomRightY: Int!
  imageAnnotation: AWSJSON # Annotation data (can be null)
}

type ImageConnection {
  items: [Image!]!
  nextToken: String
}

type Table implements Node & Metadata
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Table-specific Fields
  parentId: ID! # Document ID
  pageNum: Int!
  description: String!
}

type TableConnection {
  items: [Table!]!
  nextToken: String
}

type Text implements Node & Metadata
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Text-specific Fields
  parentId: ID! # Document ID
  pageNum: Int!
  text: String!
}

type TextConnection {
  items: [Text!]!
  nextToken: String
}

type Scan implements Node & Metadata & Storable
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Storable Fields
  s3Bucket: String!
  s3Key: String!

  # Scan-specific Fields
  parentId: ID! # Document ID
}

type ScanConnection {
  items: [Scan!]!
  nextToken: String
}

# ----------------------------------------------------------------------
# 6. ENTITIES
# ----------------------------------------------------------------------

type Document implements Node & Metadata & Storable
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID! # The ID of the document is a SHA256 hash of the document content
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Storable Fields
  s3Bucket: String!
  s3Key: String!
  mimeType: String! @default(value: "application/pdf")
  sizeBytes: Int

  # ---------------------------------------------------------
  # Access Pattern: GSI 1 (The View)
  # Queries SK begins_with "IMAGE#", "TABLE#", "TEXT#", or "SCAN#" under "DOCUMENT#<id>" PK
  # ---------------------------------------------------------
  images(limit: Int, nextToken: String): ImageConnection
  tables(limit: Int, nextToken: String): TableConnection
  texts(limit: Int, nextToken: String): TextConnection
  scans(limit: Int, nextToken: String): ScanConnection
}

type DocumentConnection {
  items: [Document!]!
  nextToken: String
}

type Project implements Node & Metadata & Shareable
  @aws_iam
  @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection

  name: String!
  description: String
  status: ProjectStatus!

  # ---------------------------------------------------------
  # Access Pattern: GSI 1 (The View)
  # Queries SK begins_with "DOCLINK#" under "PROJECT#<id>" PK
  # ---------------------------------------------------------
  doclinks(limit: Int, nextToken: String): DoclinkConnection
  topics(limit: Int, nextToken: String): TopicConnection
  notifications(limit: Int, nextToken: String): NotificationConnection
}

type ProjectConnection {
  items: [Project!]!
  nextToken: String
}

# ----------------------------------------------------------------------
# 7. INPUTS
# ----------------------------------------------------------------------

# DOCUMENT INPUTS
input CreateDocumentInput {
  s3Bucket: String!
  s3Key: String!
  mimeType: String
  sizeBytes: Int
}

input UpdateDocumentInput {
  s3Bucket: String
  s3Key: String
  mimeType: String
  sizeBytes: Int
}

input DeleteDocumentInput {
  id: ID!
}

# PROJECT INPUTS
input CreateProjectInput {
  name: String
  description: String
  status: ProjectStatus = ACTIVE
  sharingMode: SharingMode = PRIVATE
}

input UpdateProjectInput {
  name: String
  description: String
  status: ProjectStatus
  sharingMode: SharingMode
}

# DOCLINK INPUTS
input CreateDoclinkInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  documentId: ID!
  filename: String!
  status: DoclinkStatus = NOT_UPLOADED
}

input UpdateDoclinkInput {
  filename: String
  status: DoclinkStatus
}

# NOTIFICATION INPUTS
input CreateNotificationInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  message: String!
  properties: AWSJSON
}

input UpdateNotificationInput {
  message: String
  properties: AWSJSON
}

# IMAGE INPUTS
input CreateImageInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  # Storable Fields
  s3Bucket: String!
  s3Key: String!
  mimeType: String
  sizeBytes: Int

  # Image-specific Fields
  pageNum: Int!
  imageId: String!
  topLeftX: Int!
  topLeftY: Int!
  bottomRightX: Int!
  bottomRightY: Int!
  imageAnnotation: AWSJSON
}

input UpdateImageInput {
  # Storable Fields
  s3Bucket: String
  s3Key: String
  mimeType: String
  sizeBytes: Int

  # Image-specific Fields
  pageNum: Int
  imageId: String
  topLeftX: Int
  topLeftY: Int
  bottomRightX: Int
  bottomRightY: Int
  imageAnnotation: AWSJSON
}

# TABLE INPUTS
input CreateTableInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  # Table-specific Fields
  pageNum: Int!
  description: String!
}

input UpdateTableInput {
  # Table-specific Fields
  pageNum: Int
  description: String
}

# TEXT INPUTS
input CreateTextInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  # Text-specific Fields
  pageNum: Int!
  text: String!
}

input UpdateTextInput {
  # Text-specific Fields
  pageNum: Int
  text: String
}

# SCAN INPUTS
input CreateScanInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  # Storable Fields
  s3Bucket: String!
  s3Key: String!
}

input UpdateScanInput {
  # Storable Fields
  s3Bucket: String
  s3Key: String
}

# ----------------------------------------------------------------------
# 8. QUERIES
# ----------------------------------------------------------------------

type Query {
  # DOCUMENT QUERIES
  getDocument(id: ID!): Document
  listDocuments(limit: Int, nextToken: String): DocumentConnection!

  # PROJECT QUERIES
  getProject(id: ID!): Project
  listProjects(
    scope: ListScope = OWNED_BY_ME
    limit: Int
    nextToken: String
  ): ProjectConnection!

  """
  Get a single Doclink. Requires composite key (ID + ParentID) for access.
  """
  getDoclink(key: CompositeKeyInput!): Doclink

  """
  List Doclinks for a specific Project. Uses GSI1 (The View).
  """
  listDoclinks(
    parentId: ID! # Required: Cannot list "all docs in tenant" efficiently
    limit: Int
    nextToken: String
  ): DoclinkConnection!

  """
  Get a single Notification. Requires composite key (ID + ParentID) for access.
  """
  getNotification(key: CompositeKeyInput!): Notification

  """
  List Notifications for a specific Project. Uses GSI1 (The View).
  """
  listNotifications(
    parentId: ID! # Required: Cannot list "all notifications in tenant" efficiently
    limit: Int
    nextToken: String
  ): NotificationConnection!

  """
  Get a single Image. Requires composite key (ID + ParentID) for access.
  """
  getImage(key: CompositeKeyInput!): Image

  """
  List Images for a specific Document. Uses GSI1 (The View).
  """
  listImages(
    parentId: ID! # Required: Cannot list "all images in tenant" efficiently
    limit: Int
    nextToken: String
  ): ImageConnection!

  """
  Get a single Table. Requires composite key (ID + ParentID) for access.
  """
  getTable(key: CompositeKeyInput!): Table

  """
  List Tables for a specific Document. Uses GSI1 (The View).
  """
  listTables(
    parentId: ID! # Required: Cannot list "all tables in tenant" efficiently
    limit: Int
    nextToken: String
  ): TableConnection!

  """
  Get a single Text. Requires composite key (ID + ParentID) for access.
  """
  getText(key: CompositeKeyInput!): Text

  """
  List Texts for a specific Document. Uses GSI1 (The View).
  """
  listTexts(
    parentId: ID! # Required: Cannot list "all texts in tenant" efficiently
    limit: Int
    nextToken: String
  ): TextConnection!

  """
  Get a single Scan. Requires composite key (ID + ParentID) for access.
  """
  getScan(key: CompositeKeyInput!): Scan

  """
  List Scans for a specific Document. Uses GSI1 (The View).
  """
  listScans(
    parentId: ID! # Required: Cannot list "all scans in tenant" efficiently
    limit: Int
    nextToken: String
  ): ScanConnection!
}

# ----------------------------------------------------------------------
# 9. MUTATIONS
# ----------------------------------------------------------------------

type Mutation {
  # DOCUMENT OPERATIONS
  createDocument(input: CreateDocumentInput!): Document
  updateDocument(id: ID!, input: UpdateDocumentInput!): Document
  deleteDocument(id: ID!): Document

  # PROJECT OPERATIONS
  createProject(input: CreateProjectInput!): Project
  updateProject(id: ID!, input: UpdateProjectInput!): Project
  deleteProject(id: ID!): Project
  restoreProject(id: ID!): Project

  # DOCLINK OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createDoclink(input: CreateDoclinkInput!): Doclink

  # Update: Uses Composite Key to access Main Table
  updateDoclink(key: CompositeKeyInput!, input: UpdateDoclinkInput!): Doclink

  # Delete: Uses Composite Key to access Main Table
  deleteDoclink(key: CompositeKeyInput!): Doclink

  # NOTIFICATION OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createNotification(input: CreateNotificationInput!): Notification @aws_iam

  # Update: Uses Composite Key to access Main Table
  updateNotification(key: CompositeKeyInput!, input: UpdateNotificationInput!): Notification @aws_iam

  # Delete: Uses Composite Key to access Main Table
  deleteNotification(key: CompositeKeyInput!): Notification @aws_iam

  # IMAGE OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createImage(input: CreateImageInput!): Image

  # Update: Uses Composite Key to access Main Table
  updateImage(key: CompositeKeyInput!, input: UpdateImageInput!): Image

  # Delete: Uses Composite Key to access Main Table
  deleteImage(key: CompositeKeyInput!): Image

  # TABLE OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createTable(input: CreateTableInput!): Table

  # Update: Uses Composite Key to access Main Table
  updateTable(key: CompositeKeyInput!, input: UpdateTableInput!): Table

  # Delete: Uses Composite Key to access Main Table
  deleteTable(key: CompositeKeyInput!): Table

  # TEXT OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createText(input: CreateTextInput!): Text

  # Update: Uses Composite Key to access Main Table
  updateText(key: CompositeKeyInput!, input: UpdateTextInput!): Text

  # Delete: Uses Composite Key to access Main Table
  deleteText(key: CompositeKeyInput!): Text

  # SCAN OPERATIONS
  # Create: Uses parentId from input to write to Main Table
  createScan(input: CreateScanInput!): Scan

  # Update: Uses Composite Key to access Main Table
  updateScan(key: CompositeKeyInput!, input: UpdateScanInput!): Scan

  # Delete: Uses Composite Key to access Main Table
  deleteScan(key: CompositeKeyInput!): Scan
}

# ----------------------------------------------------------------------
# 10. SUBSCRIPTIONS
# ----------------------------------------------------------------------

type Subscription {
  """
  DOCUMENT SUBSCRIPTIONS
  """
  onCreateDocument(ownerId: ID, tenantId: ID): Document
    @aws_subscribe(mutations: ["createDocument"])

  onUpdateDocument(id: ID!): Document
    @aws_subscribe(mutations: ["updateDocument"])

  onDeleteDocument(id: ID!): Document
    @aws_subscribe(mutations: ["deleteDocument"])

  """
  PROJECT SUBSCRIPTIONS
  """
  onCreateProject(ownerId: ID, tenantId: ID): Project
    @aws_subscribe(mutations: ["createProject"])

  # Triggered when a specific project is updated (Real-time Details)
  onUpdateProject(id: ID!): Project
    @aws_subscribe(mutations: ["updateProject", "restoreProject"])

  # Triggered when a specific project is deleted (Cleanup)
  onDeleteProject(id: ID!): Project @aws_subscribe(mutations: ["deleteProject"])

  onRestoreProject(id: ID!): Project
    @aws_subscribe(mutations: ["restoreProject"])

  """
  DOCLINK SUBSCRIPTIONS
  """
  onCreateDoclink(parentId: ID): Doclink
    @aws_subscribe(mutations: ["createDoclink"])

  # Triggered when a specific Doclink is updated (e.g. status change)
  onUpdateDoclink(id: ID!): Doclink @aws_subscribe(mutations: ["updateDoclink"])

  # Triggered when a specific Doclink is deleted
  onDeleteDoclink(id: ID!): Doclink @aws_subscribe(mutations: ["deleteDoclink"])

  """
  NOTIFICATION SUBSCRIPTIONS
  """
  onCreateNotification(parentId: ID): Notification
    @aws_subscribe(mutations: ["createNotification"])

  # Triggered when a specific Notification is updated
  onUpdateNotification(id: ID!): Notification
    @aws_subscribe(mutations: ["updateNotification"])

  # Triggered when a specific Notification is deleted
  onDeleteNotification(id: ID!): Notification
    @aws_subscribe(mutations: ["deleteNotification"])

  """
  IMAGE SUBSCRIPTIONS
  """
  onCreateImage(parentId: ID): Image
    @aws_subscribe(mutations: ["createImage"])

  # Triggered when a specific Image is updated
  onUpdateImage(id: ID!): Image @aws_subscribe(mutations: ["updateImage"])

  # Triggered when a specific Image is deleted
  onDeleteImage(id: ID!): Image @aws_subscribe(mutations: ["deleteImage"])

  """
  TABLE SUBSCRIPTIONS
  """
  onCreateTable(parentId: ID): Table
    @aws_subscribe(mutations: ["createTable"])

  # Triggered when a specific Table is updated
  onUpdateTable(id: ID!): Table @aws_subscribe(mutations: ["updateTable"])

  # Triggered when a specific Table is deleted
  onDeleteTable(id: ID!): Table @aws_subscribe(mutations: ["deleteTable"])

  """
  TEXT SUBSCRIPTIONS
  """
  onCreateText(parentId: ID): Text
    @aws_subscribe(mutations: ["createText"])

  # Triggered when a specific Text is updated
  onUpdateText(id: ID!): Text @aws_subscribe(mutations: ["updateText"])

  # Triggered when a specific Text is deleted
  onDeleteText(id: ID!): Text @aws_subscribe(mutations: ["deleteText"])

  """
  SCAN SUBSCRIPTIONS
  """
  onCreateScan(parentId: ID): Scan
    @aws_subscribe(mutations: ["createScan"])

  # Triggered when a specific Scan is updated
  onUpdateScan(id: ID!): Scan @aws_subscribe(mutations: ["updateScan"])

  # Triggered when a specific Scan is deleted
  onDeleteScan(id: ID!): Scan @aws_subscribe(mutations: ["deleteScan"])
}
