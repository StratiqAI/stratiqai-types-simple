# ----------------------------------------------------------------------
# 8. QUERIES
# ----------------------------------------------------------------------

type Query {
  # DOCUMENT QUERIES
  getDocument(id: ID!): Document
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )
  listDocuments(limit: Int, nextToken: String): DocumentConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  # PROJECT QUERIES
  getProject(id: ID!): Project
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )
  listProjects(
    scope: ListScope = OWNED_BY_ME
    limit: Int
    nextToken: String
  ): ProjectConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Doclink. Requires composite key (ID + ParentID) for access.
  """
  getDoclink(key: CompositeKeyInput!): Doclink

  """
  List Doclinks for a specific Project. Uses GSI1 (The View).
  """
  listDoclinks(
    parentId: ID! # Required: Cannot list "all docs in tenant" efficiently
    limit: Int
    nextToken: String
  ): DoclinkConnection!

  """
  Get a single Notification. Requires composite key (ID + ParentID) for access.
  """
  getNotification(key: CompositeKeyInput!): Notification
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List Notifications for a specific Project. Uses GSI1 (The View).
  """
  listNotifications(
    parentId: ID! # Required: Cannot list "all notifications in tenant" efficiently
    limit: Int
    nextToken: String
  ): NotificationConnection!

  """
  Get a single PromptTemplate. Requires composite key (ID + ParentID) for access.
  """
  getPromptTemplate(key: CompositeKeyInput!): PromptTemplate
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List PromptTemplates for a specific Project. Uses GSI1 (The View).
  """
  listPromptTemplates(
    parentId: ID! # Required: Cannot list "all prompt templates in tenant" efficiently
    limit: Int
    nextToken: String
  ): PromptTemplateConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Image. Requires composite key (ID + ParentID) for access.
  """
  getImage(key: CompositeKeyInput!): Image
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List Images for a specific Document. Uses GSI1 (The View).
  """
  listImages(
    parentId: ID! # Required: Cannot list "all images in tenant" efficiently
    limit: Int
    nextToken: String
  ): ImageConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Table. Requires composite key (ID + ParentID) for access.
  """
  getTable(key: CompositeKeyInput!): Table
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List Tables for a specific Document. Uses GSI1 (The View).
  """
  listTables(
    parentId: ID! # Required: Cannot list "all tables in tenant" efficiently
    limit: Int
    nextToken: String
  ): TableConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Text. Requires composite key (ID + ParentID) for access.
  """
  getText(key: CompositeKeyInput!): Text

  """
  List Texts for a specific Document. Uses GSI1 (The View).
  """
  listTexts(
    parentId: ID! # Required: Cannot list "all texts in tenant" efficiently
    limit: Int
    nextToken: String
  ): TextConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Scan. Requires composite key (ID + ParentID) for access.
  """
  getScan(key: CompositeKeyInput!): Scan
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List Scans for a specific Document. Uses GSI1 (The View).
  """
  listScans(
    parentId: ID! # Required: Cannot list "all scans in tenant" efficiently
    limit: Int
    nextToken: String
  ): ScanConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  # WORKFLOW QUERIES
  getWorkflow(id: ID!): Workflow
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )
  listWorkflows(limit: Int, nextToken: String): WorkflowConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  # WORKFLOW EXECUTION QUERIES
  getWorkflowExecution(id: ID!): WorkflowExecution
    @aws_iam
    @aws_cognito_user_pools(
