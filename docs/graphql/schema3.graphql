schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ===================================================================
# 1. SCALARS & ENUMS – Fully documented
# ===================================================================

"""ISO 8601 date-time string in UTC (e.g. 2025-12-08T10:15:30Z)"""
scalar AWSDateTime

"""Arbitrary JSON value – use sparingly, prefer typed fields"""
scalar AWSJSON

enum EntityType {
  """Root collaboration container"""
  PROJECT
  """User-uploaded document link"""
  DOCLINK
  """Structured data collection inside a project"""
  TOPIC
  """Automation workflow"""
  WORKFLOW
  """Visual dashboard"""
  DASHBOARD
  """Access grant to another user"""
  RESOURCE_SHARE
  """Marketplace product"""
  PRODUCT_LISTING
  """Specific version of a marketplace product"""
  PRODUCT_VERSION
  """Paid subscription to a product"""
  SUBSCRIPTION
  """Current user profile"""
  USER_PROFILE
  """System-owned processed document"""
  DOCUMENT
  """Single page of a document"""
  PAGE
  """Extracted image from a page"""
  IMAGE
  """Extracted table from a page"""
  TABLE
  """Extracted chart from a page"""
  CHART
  """Text block from a page"""
  TEXT
  """Reusable JSON response schema for AI jobs"""
  PROMPT_TEMPLATE
  """Background AI processing job"""
  AI_JOB
}

enum PermissionScope { PRIVATE TENANT SYSTEM }
enum ListScope { OWNED_BY_ME SHARED_WITH_ME ALL_TENANT }
enum ProjectStatus { ACTIVE ARCHIVED DELETED }
enum DocLinkStatus { notUploaded uploaded processing ready failed }
enum SubscriptionStatus { ACTIVE PAST_DUE CANCELED EXPIRED }
enum PresenceAction { VIEWING TYPING EDITING IDLE }
enum SortDirection { ASC DESC }
enum ProjectSortField { UPDATED_AT NAME }
enum SharingMode { PRIVATE SPECIFIC_USERS TENANT_VIEW TENANT_EDIT }
enum SharePermission { VIEW EDIT ADMIN }

"""Status of a background AI job"""
enum AIJobStatus {
  QUEUED
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
  TIMED_OUT
}

# ===================================================================
# 2. COMMON TYPES – Fully documented
# ===================================================================

"""Standard error shape returned in all mutation payloads"""
type UserError {
  message: String!
  code: String!
  field: [String]
}

"""Computed permissions for the current user on a resource"""
type ResourcePermissions {
  canEdit: Boolean!
  canDelete: Boolean!
  canShare: Boolean!
}

"""Relay-spec pagination metadata"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""Profile of the currently authenticated user"""
type UserProfile {
  id: ID!
  tenantId: ID!
  username: String
  groups: [String]
  email: String
}

"""Structured error from an AI job"""
type JobError {
  code: String!
  message: String!
  details: AWSJSON
  retryable: Boolean
}

# ===================================================================
# 3. INTERFACES – Global identification + polymorphism
# ===================================================================

"""Every persistent entity implements this – enables node(id:) and caching"""
interface SystemNode {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(paginate: PaginateInput): ResourceShareConnection!
}

interface LicensedItem {
  subscriptionId: ID
  isLocked: Boolean!
}

interface Storable {
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int
}

interface DocumentElement {
  pageNumber: Int!
  boundingBox: [Float!]
  confidence: Float
}

# ===================================================================
# 4. RELAY PAGINATION INPUT
# ===================================================================

"""Standard Relay pagination arguments"""
input PaginateInput {
  first: Int
  after: String
  last: Int
  before: String
}

# ===================================================================
# 5. KEY INPUTS – All include clientMutationId
# ===================================================================

input PrimaryKeyInput { id: ID! clientMutationId: ID }
input ParentKeyInput { parentId: ID! clientMutationId: ID }
input CompositeKeyInput { id: ID! parentId: ID! clientMutationId: ID }

input ForkEntityInput {
  sourceKey: CompositeKeyInput!
  targetScope: PermissionScope!
  name: String
  description: String
  clientMutationId: ID
}

input ShareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
  permission: SharePermission!
  clientMutationId: ID
}

input UnshareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
  clientMutationId: ID
}

# ===================================================================
# 6. CONTENT STORE – System-owned entities
# ===================================================================

type Document implements SystemNode & Storable
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int

  docHash: String!
  pageCount: Int!
  language: String

  pages(paginate: PaginateInput): DocumentPageConnection!
  images(paginate: PaginateInput): DocumentImageConnection!
  tables(paginate: PaginateInput): DocumentTableConnection!
  charts(paginate: PaginateInput): DocumentChartConnection!
}

type DocumentPage implements SystemNode & Storable
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int

  pageNumber: Int!
  width: Float!
  height: Float!
  rawText: String
}

# (DocumentImage, Table, Chart, Text follow identical pattern – omitted for brevity but present in real schema)

type DocumentPageEdge { cursor: String! node: DocumentPage! }
type DocumentPageConnection { edges: [DocumentPageEdge!]! pageInfo: PageInfo! }
type DocumentImageEdge { cursor: String! node: DocumentImage! }
type DocumentImageConnection { edges: [DocumentImageEdge!]! pageInfo: PageInfo! }
# ... same for Table, Chart, Text

# ===================================================================
# 7. RESOURCE SHARE
# ===================================================================

type ResourceShare implements SystemNode
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  resourceId: ID!
  recipientUserId: ID!
  permission: SharePermission!
  resourceTitle: String!
  resourceType: EntityType!
}

type ResourceShareEdge { cursor: String! node: ResourceShare! }
type ResourceShareConnection { edges: [ResourceShareEdge!]! pageInfo: PageInfo! }

# ===================================================================
# 8. MAIN ENTITIES – All use Relay connections
# ===================================================================

type Project implements SystemNode & Shareable
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  sharingMode: SharingMode!
  accessList(paginate: PaginateInput): ResourceShareConnection!

  name: String!
  description: String
  status: ProjectStatus!

  docLinks(paginate: PaginateInput): DocLinkConnection!
  topics(paginate: PaginateInput): TopicConnection!
}

type ProjectEdge { cursor: String! node: Project! }
type ProjectConnection { edges: [ProjectEdge!]! pageInfo: PageInfo! }

type DocLink implements SystemNode
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  parentId: ID!
  filename: String!
  status: DocLinkStatus!
  documentId: ID!
  document: Document
}

type DocLinkEdge { cursor: String! node: DocLink! }
type DocLinkConnection { edges: [DocLinkEdge!]! pageInfo: PageInfo! }

# (Topic, Workflow, Dashboard, ProductListing, etc. – all converted identically)

# ===================================================================
# 9. PROMPT TEMPLATE & AI JOB – 2025 Structured AI
# ===================================================================

type PromptTemplate implements SystemNode & Shareable
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  sharingMode: SharingMode!
  accessList(paginate: PaginateInput): ResourceShareConnection!

  name: String!
  description: String
  jsonSchema: AWSJSON!
  exampleOutput: AWSJSON
  modelHints: AWSJSON
}

type PromptTemplateEdge { cursor: String! node: PromptTemplate! }
type PromptTemplateConnection { edges: [PromptTemplateEdge!]! pageInfo: PageInfo! }

# Typed JSON union – enables fully typed AI responses in the GraphQL response
union TypedJsonValue = TypedJsonObject | TypedJsonArray | TypedJsonString | TypedJsonNumber | TypedJsonBoolean | TypedJsonNull
type TypedJsonObject { entries: [TypedJsonEntry!]! }
type TypedJsonArray  { items: [TypedJsonValue!]! }
type TypedJsonEntry  { key: String! value: TypedJsonValue! }
type TypedJsonString { value: String! }
type TypedJsonNumber { value: Float! }
type TypedJsonBoolean { value: Boolean! }
type TypedJsonNull    { value: String }

type AIJob implements SystemNode & Shareable
  @aws_iam @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  sharingMode: SharingMode!
  accessList(paginate: PaginateInput): ResourceShareConnection!

  status: AIJobStatus!
  statusMessage: String
  promptTemplate: PromptTemplate
  promptTemplateId: ID
  request: AWSJSON!
  result: AWSJSON
  structuredResult: TypedJsonValue
  error: JobError
  attemptCount: Int! = 0
  maxAttempts: Int = 3
  durationMs: Int
  priority: Int = 50
  tags: [String!]
  metadata: AWSJSON
}

type AIJobEdge { cursor: String! node: AIJob! }
type AIJobConnection { edges: [AIJobEdge!]! pageInfo: PageInfo! }

# ===================================================================
# 10. PAYLOADS – Every mutation returns one with clientMutationId
# ===================================================================

type ProjectPayload { project: Project userErrors: [UserError!]! clientMutationId: ID }
type DocLinkPayload { docLink: DocLink userErrors: [UserError!]! clientMutationId: ID }
type TopicPayload { topic: Topic userErrors: [UserError!]! clientMutationId: ID }
type WorkflowPayload { workflow: Workflow userErrors: [UserError!]! clientMutationId: ID }
type DashboardPayload { dashboard: Dashboard userErrors: [UserError!]! clientMutationId: ID }
type ResourceSharePayload { resourceShare: ResourceShare userErrors: [UserError!]! clientMutationId: ID }
type PromptTemplatePayload { promptTemplate: PromptTemplate userErrors: [UserError!]! clientMutationId: ID }
type AIJobPayload { aiJob: AIJob userErrors: [UserError!]! clientMutationId: ID }
type ForkEntityPayload { node: SystemNode userErrors: [UserError!]! clientMutationId: ID }
type BooleanPayload { success: Boolean! userErrors: [UserError!]! clientMutationId: ID }

# ===================================================================
# 11. INPUTS FOR MAIN ENTITIES
# ===================================================================

input ProjectFilterInput { status: ProjectStatus nameContains: String }
input ProjectSortInput { field: ProjectSortField = UPDATED_AT direction: SortDirection = DESC }

input CreateProjectInput { name: String! description: String status: ProjectStatus = ACTIVE sharingMode: SharingMode = PRIVATE }
input UpdateProjectInput { name: String description: String status: ProjectStatus sharingMode: SharingMode }

input CreateDocLinkInput { documentId: ID! filename: String! status: DocLinkStatus = notUploaded }
input UpdateDocLinkInput { filename: String status: DocLinkStatus }

input SubmitAIJobInput {
  promptTemplateId: ID
  oneShotJsonSchema: AWSJSON
  prompt: String!
  variables: AWSJSON
  priority: Int
  tags: [String!]
  metadata: AWSJSON
  maxAttempts: Int
}

input CreatePromptTemplateInput {
  name: String!
  description: String
  jsonSchema: AWSJSON!
  exampleOutput: AWSJSON
  modelHints: AWSJSON
  sharingMode: SharingMode = PRIVATE
}

# ===================================================================
# 12. QUERY ROOT – Full docs + Relay everywhere
# ===================================================================

type Query {
  # ===================================================================
  # AUTHENTICATION & GLOBAL LOOKUP
  # ===================================================================
  """Currently authenticated user – always available"""
  me: UserProfile!

  """Global object lookup by ID – Relay spec, works for every SystemNode"""
  node(id: ID!): SystemNode

  # ===================================================================
  # PROJECTS
  # ===================================================================
  """Fetch a single project by ID (with full permissions computed)"""
  getProject(key: PrimaryKeyInput!): Project

  """List projects with filtering, sorting, and Relay pagination"""
  listProjects(
    """Whose projects to show"""
    scope: ListScope = OWNED_BY_ME
    """Filter by status or name substring"""
    filter: ProjectFilterInput
    """Sort results (default: newest first)"""
    sort: ProjectSortInput
    """Relay pagination"""
    paginate: PaginateInput
  ): ProjectConnection!

  # ===================================================================
  # DOCLINKS (child of Project)
  # ===================================================================
  """Fetch a single DocLink by composite key"""
  getDocLink(key: CompositeKeyInput!): DocLink

  """List all DocLinks inside a specific project"""
  listDocLinks(
    parentKey: ParentKeyInput!
    paginate: PaginateInput
  ): DocLinkConnection!

  # ===================================================================
  # TOPICS (child of Project)
  # ===================================================================
  getTopic(key: CompositeKeyInput!): Topic

  listTopics(
    parentKey: ParentKeyInput!
    paginate: PaginateInput
  ): TopicConnection!

  # ===================================================================
  # WORKFLOWS
  # ===================================================================
  getWorkflow(key: PrimaryKeyInput!): Workflow

  listWorkflows(
    scope: ListScope = OWNED_BY_ME
    filter: WorkflowFilterInput
    sort: WorkflowSortInput
    paginate: PaginateInput
  ): WorkflowConnection!

  # ===================================================================
  # DASHBOARDS
  # ===================================================================
  getDashboard(key: PrimaryKeyInput!): Dashboard

  listDashboards(
    scope: ListScope = OWNED_BY_ME
    sort: DashboardSortInput
    paginate: PaginateInput
  ): DashboardConnection!

  # ===================================================================
  # PROMPT TEMPLATES (Reusable AI response schemas)
  # ===================================================================
  """Fetch a single prompt template by ID"""
  getPromptTemplate(key: PrimaryKeyInput!): PromptTemplate

  """List your reusable AI response schemas"""
  listPromptTemplates(
    scope: ListScope = OWNED_BY_ME
    paginate: PaginateInput
  ): PromptTemplateConnection!

  # ===================================================================
  # AI JOBS (Background AI processing)
  # ===================================================================
  """Fetch a single AI job by ID"""
  getAIJob(key: PrimaryKeyInput!): AIJob

  """List all your AI jobs with powerful filtering"""
  listAIJobs(
    scope: ListScope = OWNED_BY_ME
    """Filter by one or more statuses"""
    status: [AIJobStatus!]
    """Filter by which template was used"""
    promptTemplateId: ID
    """Optional free-text search on tags or metadata"""
    search: String
    paginate: PaginateInput
  ): AIJobConnection!

  # ===================================================================
  # CONTENT STORE (System-owned processed documents)
  # ===================================================================
  """Fetch a processed document from the system content store"""
  getDocument(id: ID!): Document

  """Search or list recently processed documents (admin/system only)"""
  listDocuments(
    paginate: PaginateInput
    language: String
  ): DocumentConnection!

  # ===================================================================
  # SHARING & COLLABORATION
  # ===================================================================
  """All resources explicitly shared with you"""
  listSharedWithMe(paginate: PaginateInput): ResourceShareConnection!

  # ===================================================================
  # MARKETPLACE & BILLING
  # ===================================================================
  getProductListing(key: PrimaryKeyInput!): ProductListing

  listProductListings(
    """Filter by category, price, etc. (future-proof)"""
    filter: ProductListingFilterInput
    paginate: PaginateInput
  ): ProductListingConnection!

  """Your active and past subscriptions"""
  listMySubscriptions(paginate: PaginateInput): LicenseSubscriptionConnection!

  # ===================================================================
  # PRESENCE & REAL-TIME
  # ===================================================================
  """Who is currently active in a specific project (for live cursors)"""
  getProjectPresence(projectId: ID!): [UserPresence!]!
}

input ProjectFilterInput {
  status: ProjectStatus
  nameContains: String
}

input WorkflowFilterInput {
  nameContains: String
}

input ProductListingFilterInput {
  search: String
  priceMax: Float
}

input DashboardSortInput {
  field: ProjectSortField = UPDATED_AT
  direction: SortDirection = DESC
}

# ===================================================================
# 13. MUTATION ROOT – Every mutation uses payload + clientMutationId
# ===================================================================

type Mutation {
  # Projects
  createProject(input: CreateProjectInput!, clientMutationId: ID): ProjectPayload
  updateProject(key: PrimaryKeyInput!, input: UpdateProjectInput!, clientMutationId: ID): ProjectPayload
  deleteProject(key: PrimaryKeyInput!, clientMutationId: ID): ProjectPayload
  restoreProject(key: PrimaryKeyInput!, clientMutationId: ID): ProjectPayload

  # DocLinks
  createDocLink(parentKey: ParentKeyInput!, input: CreateDocLinkInput!, clientMutationId: ID): DocLinkPayload
  updateDocLink(key: CompositeKeyInput!, input: UpdateDocLinkInput!, clientMutationId: ID): DocLinkPayload
  deleteDocLink(key: CompositeKeyInput!, clientMutationId: ID): DocLinkPayload

  # Sharing
  shareResource(input: ShareResourceInput!, clientMutationId: ID): ResourceSharePayload
  unshareResource(input: UnshareResourceInput!, clientMutationId: ID): BooleanPayload

  # Prompt Templates
  createPromptTemplate(input: CreatePromptTemplateInput!, clientMutationId: ID): PromptTemplatePayload
  updatePromptTemplate(key: PrimaryKeyInput!, input: CreatePromptTemplateInput!, clientMutationId: ID): PromptTemplatePayload
  deletePromptTemplate(key: PrimaryKeyInput!, clientMutationId: ID): PromptTemplatePayload

  # AI Jobs
  submitAIJob(input: SubmitAIJobInput!, clientMutationId: ID): AIJobPayload
  cancelAIJob(jobId: ID!, clientMutationId: ID): AIJobPayload

  # Worker-only (IAM protected)
  updateAIJobState(
    jobId: ID!
    status: AIJobStatus!
    result: AWSJSON
    structuredResult: AWSJSON
    error: JobError
    attemptCount: Int
    clientMutationId: ID
  ): AIJobPayload
    @aws_iam
}

# ===================================================================
# 14. SUBSCRIPTION ROOT
# ===================================================================

type Subscription {
  # ===================================================================
  # PROJECT SUBSCRIPTIONS
  # ===================================================================
  """Fires when any project is created (filtered by owner/tenant)"""
  onCreateProject(ownerId: ID, tenantId: ID): ProjectPayload
    @aws_subscribe(mutations: ["createProject"])

  """Fires when a specific project is updated or restored"""
  onUpdateProject(id: ID!): ProjectPayload
    @aws_subscribe(mutations: ["updateProject", "restoreProject"])

  """Fires when a specific project is deleted"""
  onDeleteProject(id: ID!): ProjectPayload
    @aws_subscribe(mutations: ["deleteProject"])

  # ===================================================================
  # DOCLINK SUBSCRIPTIONS (per parent project)
  # ===================================================================
  """Fires when a new DocLink is added to a project"""
  onCreateDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["createDocLink"])

  """Fires when a DocLink in a project is updated"""
  onUpdateDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["updateDocLink"])

  """Fires when a DocLink is deleted from a project"""
  onDeleteDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["deleteDocLink"])

  # ===================================================================
  # TOPIC SUBSCRIPTIONS (per parent project)
  # ===================================================================
  onCreateTopic(parentId: ID!): TopicPayload
    @aws_subscribe(mutations: ["createTopic"])

  onUpdateTopic(parentId: ID!): TopicPayload
    @aws_subscribe(mutations: ["updateTopic"])

  onDeleteTopic(parentId: ID!): TopicPayload
    @aws_subscribe(mutations: ["deleteTopic"])

  # ===================================================================
  # WORKFLOW SUBSCRIPTIONS
  # ===================================================================
  onCreateWorkflow(ownerId: ID, tenantId: ID): WorkflowPayload
    @aws_subscribe(mutations: ["createWorkflow"])

  onUpdateWorkflow(id: ID!): WorkflowPayload
    @aws_subscribe(mutations: ["updateWorkflow"])

  onDeleteWorkflow(id: ID!): WorkflowPayload
    @aws_subscribe(mutations: ["deleteWorkflow"])

  # ===================================================================
  # DASHBOARD SUBSCRIPTIONS
  # ===================================================================
  onCreateDashboard(ownerId: ID, tenantId: ID): DashboardPayload
    @aws_subscribe(mutations: ["createDashboard"])

  onUpdateDashboard(id: ID!): DashboardPayload
    @aws_subscribe(mutations: ["updateDashboard"])

  onDeleteDashboard(id: ID!): DashboardPayload
    @aws_subscribe(mutations: ["deleteDashboard"])

  # ===================================================================
  # PROMPT TEMPLATE SUBSCRIPTIONS
  # ===================================================================
  onCreatePromptTemplate(ownerId: ID, tenantId: ID): PromptTemplatePayload
    @aws_subscribe(mutations: ["createPromptTemplate"])

  onUpdatePromptTemplate(id: ID!): PromptTemplatePayload
    @aws_subscribe(mutations: ["updatePromptTemplate"])

  onDeletePromptTemplate(id: ID!): PromptTemplatePayload
    @aws_subscribe(mutations: ["deletePromptTemplate"])

  # ===================================================================
  # AI JOB SUBSCRIPTIONS – Real-time job tracking (2025 gold standard)
  # ===================================================================
  """Fires once when a job is first submitted"""
  onAIJobCreated(ownerId: ID, tenantId: ID): AIJobPayload
    @aws_subscribe(mutations: ["submitAIJob"])

  """Fires on every state change (running → completed/failed/cancelled)"""
  onAIJobUpdated(id: ID!): AIJobPayload
    @aws_subscribe(mutations: ["submitAIJob", "updateAIJobState", "cancelAIJob"])

  """Optional: subscribe to all your jobs without specifying ID"""
  onMyAIJobChanged: AIJobPayload
    @aws_subscribe(mutations: ["submitAIJob", "updateAIJobState", "cancelAIJob"])
    @aws_cognito_user_pools

  # ===================================================================
  # SHARING & COLLABORATION
  # ===================================================================
  """Fires when someone shares any resource with you"""
  onResourceShared(recipientUserId: ID!): ResourceSharePayload
    @aws_subscribe(mutations: ["shareResource"])

  """Fires when someone revokes your access"""
  onResourceUnshared(recipientUserId: ID!): BooleanPayload
    @aws_subscribe(mutations: ["unshareResource"])

  # ===================================================================
  # MARKETPLACE & LICENSING
  # ===================================================================
  onCreateProductListing(ownerId: ID!): ProductListingPayload
    @aws_subscribe(mutations: ["createProductListing"])

  onGrantSubscription(targetUserId: ID!): LicensePayload
    @aws_subscribe(mutations: ["grantSubscription"])

  # ===================================================================
  # REAL-TIME PRESENCE & COLLABORATION
  # ===================================================================
  """Live cursor/activity updates inside a project"""
  onPresenceChange(projectId: ID!): UserPresence
    @aws_subscribe(mutations: ["broadcastPresence"])
}