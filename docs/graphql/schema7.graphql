schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ----------------------------------------------------------------------
# 1. SCALARS
# ----------------------------------------------------------------------

"""
Extended scalar for Date and Time (ISO 8601).
"""
scalar AWSDateTime

"""
Extended scalar for valid Email addresses.
"""
scalar AWSEmail

"""
Extended scalar for valid URLs.
"""
scalar AWSURL

"""
Extended scalar for IPv4 or IPv6 addresses.
"""
scalar AWSIPAddress

"""
Note: We avoid AWSJSON where possible to enforce strict typing, 
but it remains available for truly unstructured legacy data.
"""
scalar AWSJSON

# ----------------------------------------------------------------------
# 1.1. AWS DIRECTIVES
# ----------------------------------------------------------------------

"""
AWS AppSync directive for IAM authentication.
"""
directive @aws_iam on OBJECT | FIELD_DEFINITION

"""
AWS AppSync directive for Cognito User Pools authentication.
"""
directive @aws_cognito_user_pools(
  cognito_groups: [String!]
) on OBJECT | FIELD_DEFINITION

"""
AWS AppSync directive for authorization rules.
"""
directive @aws_auth(
  cognito_groups: [String!]
) on FIELD_DEFINITION

"""
AWS AppSync directive for real-time subscriptions.
"""
directive @aws_subscribe(
  mutations: [String!]
) on FIELD_DEFINITION

"""
GraphQL specification directive for OneOf input types.
Ensures exactly one field is provided in the input.
"""
directive @oneOf on INPUT_OBJECT

