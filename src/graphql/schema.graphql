# ----------------------------------------------------------------------
# 10. SUBSCRIPTIONS
# ----------------------------------------------------------------------

type Subscription {
  """
  DOCUMENT SUBSCRIPTIONS
  """
  onCreateDocument(ownerId: ID, tenantId: ID): Document
    @aws_subscribe(mutations: ["createDocument"])

  onUpdateDocument(id: ID!): Document
    @aws_subscribe(mutations: ["updateDocument"])

  onDeleteDocument(id: ID!): Document
    @aws_subscribe(mutations: ["deleteDocument"])

  """
  PROJECT SUBSCRIPTIONS
  """
  onCreateProject(ownerId: ID, tenantId: ID): Project
    @aws_subscribe(mutations: ["createProject"])

  # Triggered when a specific project is updated (Real-time Details)
  onUpdateProject(id: ID!): Project
    @aws_subscribe(mutations: ["updateProject", "restoreProject"])

  # Triggered when a specific project is deleted (Cleanup)
  onDeleteProject(id: ID!): Project @aws_subscribe(mutations: ["deleteProject"])

  onRestoreProject(id: ID!): Project
    @aws_subscribe(mutations: ["restoreProject"])

  """
  DOCLINK SUBSCRIPTIONS
  """
  onCreateDoclink(parentId: ID): Doclink
    @aws_subscribe(mutations: ["createDoclink"])

  # Triggered when a specific Doclink is updated (e.g. status change)
  onUpdateDoclink(id: ID!): Doclink @aws_subscribe(mutations: ["updateDoclink"])

  # Triggered when a specific Doclink is deleted
  onDeleteDoclink(id: ID!): Doclink @aws_subscribe(mutations: ["deleteDoclink"])

  """
  NOTIFICATION SUBSCRIPTIONS
  """
  onCreateNotification(parentId: ID): Notification
    @aws_subscribe(mutations: ["createNotification"])

  # Triggered when a specific Notification is updated
  onUpdateNotification(id: ID!): Notification
    @aws_subscribe(mutations: ["updateNotification"])

  # Triggered when a specific Notification is deleted
  onDeleteNotification(id: ID!): Notification
    @aws_subscribe(mutations: ["deleteNotification"])

  """
  AI STUDIO: Prompt subscriptions
  """
  onCreatePrompt: Prompt @aws_subscribe(mutations: ["createPrompt"])
  onUpdatePrompt(id: ID!): Prompt @aws_subscribe(mutations: ["updatePrompt"])
  onDeletePrompt(id: ID!): Prompt @aws_subscribe(mutations: ["deletePrompt"])

  """
  AI STUDIO: AIQueryExecution subscriptions (standard Node pattern).
  """
  onCreateAIQueryExecution(promptId: ID): AIQueryExecution
    @aws_subscribe(mutations: ["createAIQueryExecution", "submitAIQuery"])
  onUpdateAIQueryExecution(id: ID!): AIQueryExecution
    @aws_subscribe(mutations: ["updateAIQueryExecution"])
  onDeleteAIQueryExecution(id: ID!): AIQueryExecution
    @aws_subscribe(mutations: ["deleteAIQueryExecution"])

  """
  IMAGE SUBSCRIPTIONS
  """
  onCreateImage(parentId: ID): Image @aws_subscribe(mutations: ["createImage"])

  # Triggered when a specific Image is updated
  onUpdateImage(id: ID!): Image @aws_subscribe(mutations: ["updateImage"])

  # Triggered when a specific Image is deleted
  onDeleteImage(id: ID!): Image @aws_subscribe(mutations: ["deleteImage"])

  """
  TABLE SUBSCRIPTIONS
  """
  onCreateTable(parentId: ID): Table @aws_subscribe(mutations: ["createTable"])

  # Triggered when a specific Table is updated
  onUpdateTable(id: ID!): Table @aws_subscribe(mutations: ["updateTable"])

  # Triggered when a specific Table is deleted
  onDeleteTable(id: ID!): Table @aws_subscribe(mutations: ["deleteTable"])

  """
  TEXT SUBSCRIPTIONS
  """
  onCreateText(parentId: ID): Text @aws_subscribe(mutations: ["createText"])

  # Triggered when a specific Text is updated
  onUpdateText(id: ID!): Text @aws_subscribe(mutations: ["updateText"])

  # Triggered when a specific Text is deleted
  onDeleteText(id: ID!): Text @aws_subscribe(mutations: ["deleteText"])

  """
  SCAN SUBSCRIPTIONS
  """
  onCreateScan(parentId: ID): Scan @aws_subscribe(mutations: ["createScan"])

  # Triggered when a specific Scan is updated
  onUpdateScan(id: ID!): Scan @aws_subscribe(mutations: ["updateScan"])

  # Triggered when a specific Scan is deleted
  onDeleteScan(id: ID!): Scan @aws_subscribe(mutations: ["deleteScan"])

  """
  WORKFLOW SUBSCRIPTIONS
  """
  onCreateWorkflow(parentId: ID): Workflow
    @aws_subscribe(mutations: ["createWorkflow"])

  # Triggered when a specific Workflow is updated
  onUpdateWorkflow(id: ID!): Workflow
    @aws_subscribe(mutations: ["updateWorkflow"])

  # Triggered when a specific Workflow is deleted
  onDeleteWorkflow(id: ID!): Workflow
    @aws_subscribe(mutations: ["deleteWorkflow"])

  """
  WORKFLOW EXECUTION SUBSCRIPTIONS
  """
  # Subscribe to new workflow executions for a specific workflow
  onCreateWorkflowExecution(parentId: ID!): WorkflowExecution
    @aws_subscribe(mutations: ["createWorkflowExecution"])

  # Subscribe to updates for a specific workflow execution
  onUpdateWorkflowExecution(id: ID!): WorkflowExecution
    @aws_subscribe(
      mutations: [
        "updateWorkflowExecution"
        "startWorkflowExecution"
        "completeWorkflowExecution"
        "failWorkflowExecution"
        "retryWorkflowExecution"
        "cancelWorkflowExecution"
      ]
    )

  # Subscribe to all workflow executions for a workflow (via parentId filter)
  onWorkflowExecutionStatusChange(
    parentId: ID
    status: WorkflowExecutionStatus
  ): WorkflowExecution
    @aws_subscribe(
      mutations: [
        "createWorkflowExecution"
        "updateWorkflowExecution"
        "startWorkflowExecution"
        "completeWorkflowExecution"
        "failWorkflowExecution"
        "retryWorkflowExecution"
        "cancelWorkflowExecution"
      ]
    )

  """
  WORKFLOW NODE EXECUTION SUBSCRIPTIONS
  """
  # Subscribe to new node executions for a specific workflow execution
  onCreateWorkflowNodeExecution(parentId: ID!): WorkflowNodeExecution
    @aws_subscribe(mutations: ["createWorkflowNodeExecution"])

  # Subscribe to updates for a specific node execution
  onUpdateWorkflowNodeExecution(id: ID!): WorkflowNodeExecution
    @aws_subscribe(
      mutations: [
        "updateWorkflowNodeExecution"
        "startWorkflowNodeExecution"
        "completeWorkflowNodeExecution"
        "failWorkflowNodeExecution"
        "retryWorkflowNodeExecution"
      ]
    )

  # Subscribe to all node execution updates for a workflow execution
  onWorkflowNodeExecutionStatusChange(parentId: ID!): WorkflowNodeExecution
    @aws_subscribe(
      mutations: [
        "createWorkflowNodeExecution"
        "updateWorkflowNodeExecution"
        "startWorkflowNodeExecution"
        "completeWorkflowNodeExecution"
        "failWorkflowNodeExecution"
        "retryWorkflowNodeExecution"
      ]
    )
}
