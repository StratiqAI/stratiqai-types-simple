# Workflow definition: nodes and edges (layout lives in Workflow.ui).
# Auth on nested types so getWorkflow { definition { nodes, edges } } is allowed for same callers as Workflow.
type ProcessNodeConfig @aws_iam @aws_cognito_user_pools {
  options: AWSJSON
  staticOutput: AWSJSON
}

type AINodeConfig @aws_iam @aws_cognito_user_pools {
  prompt: String
  model: String
  topK: Int
  systemPrompt: String
  """
  JSON Schema for structured output (e.g. responseFormat.type eq json_schema).
  """
  structuredOutputSchema: JsonSchemaValue
}

type ToolsNodeConfig @aws_iam @aws_cognito_user_pools {
  options: AWSJSON
}

type EmptyNodeConfig @aws_iam @aws_cognito_user_pools {
  _empty: Boolean
}

"""
Trigger event for input nodes (e.g. EventBridge source/detailType).
"""
type InputNodeConfig @aws_iam @aws_cognito_user_pools {
  source: String!
  detailType: String!
}

union WorkflowNodeConfig =
  | ProcessNodeConfig
  | AINodeConfig
  | ToolsNodeConfig
  | InputNodeConfig
  | EmptyNodeConfig

