# Renamed from TopicEntryPayload to avoid collision with Mutation Response
union TopicEntryContent = AIInsight | AIJob | Workflow | Message

type Topic implements SystemNode & Shareable
  @aws_iam
  @aws_cognito_user_pools(cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]) {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
  parentId: ID!
  name: String!
  schemaTemplate: PromptTemplate
  schemaTemplateId: ID
  entryCount: Int!
