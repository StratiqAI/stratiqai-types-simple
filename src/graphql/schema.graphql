# ----------------------------------------------------------------------
# 6. ENTITIES
# ----------------------------------------------------------------------

type Document implements Node & Metadata & Storable
  @aws_iam
  @aws_cognito_user_pools {
  # Metadata Fields
  id: ID! # The ID of the document is a SHA256 hash of the document content
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Storable Fields
  fileHash: String! # SHA256 hash of the document content (same as id)
  s3Bucket: String!
  s3Key: String!
  mimeType: String! @default(value: "application/pdf")
  sizeBytes: Int

  # ---------------------------------------------------------
  # Access Pattern: GSI 1 (The View)
  # Queries SK begins_with "IMAGE#", "TABLE#", "TEXT#", or "SCAN#" under "DOCUMENT#<id>" PK
  # ---------------------------------------------------------
  images(limit: Int, nextToken: String): ImageConnection
  tables(limit: Int, nextToken: String): TableConnection
  texts(limit: Int, nextToken: String): TextConnection
  scans(limit: Int, nextToken: String): ScanConnection
}

type DocumentConnection
  @aws_iam
  @aws_cognito_user_pools(cognito_groups: ["SystemAdmins"]) {
  items: [Document!]!
  nextToken: String
}

type Project implements Node & Metadata & Shareable
  @aws_iam
  @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection

  name: String!
  description: String
  status: ProjectStatus!

  # ---------------------------------------------------------
  # Access Pattern: GSI 1 (The View)
  # Queries SK begins_with "DOCLINK#" under "PROJECT#<id>" PK
  # ---------------------------------------------------------
  doclinks(limit: Int, nextToken: String): DoclinkConnection
  topics(limit: Int, nextToken: String): TopicConnection
  notifications(limit: Int, nextToken: String): NotificationConnection
  prompttemplates(limit: Int, nextToken: String): PromptTemplateConnection
  workflows(limit: Int, nextToken: String): WorkflowConnection
  workflowexecutions(limit: Int, nextToken: String): WorkflowExecutionConnection
}

type ProjectConnection
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
