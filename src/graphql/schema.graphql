schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ----------------------------------------------------------------------
# 1. SCALARS & DIRECTIVES
# ----------------------------------------------------------------------

scalar AWSDateTime
scalar AWSJSON

directive @aws_iam on OBJECT | FIELD_DEFINITION
directive @aws_cognito_user_pools(
  cognito_groups: [String!]
) on OBJECT | FIELD_DEFINITION
directive @aws_auth(cognito_groups: [String!]) on FIELD_DEFINITION
directive @aws_subscribe(mutations: [String!]) on FIELD_DEFINITION
directive @oneOf on INPUT_OBJECT

# ----------------------------------------------------------------------
# 2. ENUMS
# ----------------------------------------------------------------------

enum EntityType {
  PROJECT
  DOCLINK
  TOPIC
  RESOURCE_SHARE
  NOTIFICATION
  DOCUMENT
  IMAGE
  TABLE
  TEXT
  SCAN
  PROMPT_TEMPLATE
  WORKFLOW
  WORKFLOW_EXECUTION
  WORKFLOW_NODE_EXECUTION
}

enum ProjectStatus {
  ACTIVE
  ARCHIVED
  DELETED
}

enum DoclinkStatus {
  NOT_UPLOADED
  UPLOADED
  PROCESSING
  READY
  FAILED
}

enum SharingMode {
  PRIVATE
  SPECIFIC_USERS
  TENANT_VIEW
  TENANT_EDIT
}

enum SharePermission {
  VIEW
  EDIT
  ADMIN
}

enum ListScope {
  OWNED_BY_ME
  SHARED_WITH_ME
  ALL_TENANT
}

enum WorkflowExecutionStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

enum WorkflowNodeExecutionStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  SKIPPED
}

# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

interface Node {
  id: ID!
}

interface Metadata {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

interface Storable {
  s3Bucket: String!
  s3Key: String!
}

# ----------------------------------------------------------------------
# 4. BASE ENTITY TYPES
# ----------------------------------------------------------------------

"""
Composite Key for accessing Child Entities (Doclink, Topic, Image, Table, Text, Scan).
Required because we do not have a Global Lookup GSI for children;
we must know the parentId to locate the item in the Main Table.
"""
input CompositeKeyInput {
  id: ID!
  parentId: ID!
}

type ResourceShare implements Node & Metadata @aws_iam @aws_cognito_user_pools {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  recipientUserId: ID!
  permission: SharePermission!
  resourceTitle: String!
  resourceType: EntityType!
}

type ResourceShareConnection {
  items: [ResourceShare!]!
  nextToken: String
}

