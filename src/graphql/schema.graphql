# DOCUMENT INPUTS
input CreateDocumentInput {
  fileHash: String!
  s3Bucket: String!
  s3Key: String!
  mimeType: String
  sizeBytes: Int
}

input UpdateDocumentInput {
  fileHash: String
  s3Bucket: String
  s3Key: String
  mimeType: String
  sizeBytes: Int
}

input DeleteDocumentInput {
  id: ID!
}

# PROJECT INPUTS
input CreateProjectInput {
  name: String
  description: String
  status: ProjectStatus = ACTIVE
  sharingMode: SharingMode = PRIVATE
}

input UpdateProjectInput {
  name: String
  description: String
  status: ProjectStatus
  sharingMode: SharingMode
}

# DOCLINK INPUTS
input CreateDoclinkInput {
  # REQUIRED: To perform the Strongly Consistent Write to Main Table
  parentId: ID!

  vectorStoreId: ID
  openAIFileId: ID

  documentId: ID!
  filename: String!
  status: DoclinkStatus = NOT_UPLOADED
}

input UpdateDoclinkInput {
  filename: String
  vectorStoreId: ID!
  openAIFileId: ID!
  status: DoclinkStatus
}

