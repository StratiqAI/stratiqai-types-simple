# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

"""
The base interface for all identifiable nodes in the system.
Supports Global Object Identification (Relay/Apollo standard).
"""
interface Node {
  id: ID!
}

"""
Standard metadata fields for system entities including ownership and audit timestamps.
"""
interface SystemMetadata {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
}

"""
Interface for entities that can be shared via Access Control Lists (ACLs).
"""
interface Shareable {
  sharingMode: SharingMode!
  """
  Returns a paginated list of users who have access to this resource.
  """
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

"""
Interface for entities that represent paid or licensed content.
"""
interface LicensedItem {
  subscriptionId: ID
  isLocked: Boolean!
}

"""
Interface for entities storing files in S3.
"""
interface Storable {
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int
}

"""
Interface for elements extracted from a document (images, charts, etc).
"""
interface DocumentElement {
  pageNumber: Int!
  boundingBox: [Float]
  confidence: Float
}

# ----------------------------------------------------------------------
# 4. COMMON OBJECTS (User Definable Schema Pattern)
# ----------------------------------------------------------------------

"""
Defines a specific field in a user-defined schema (e.g., in a Prompt Template).
"""
type PropertyDefinition {
  """
  The unique key/variable name for this property (e.g., "customer_sentiment").
  """
  key: String!
  """
  The human-readable label (e.g., "Customer Sentiment Score").
  """
  label: String!
  """
  The data type expected for this property.
  """
  dataType: PropertyType!
  """
  If true, this field must be present in the data payload.
  """
  isRequired: Boolean!
  """
  Description for the UI or AI agent.
  """
  description: String
}

"""
A concrete value for a user-defined property. 
Used in TopicEntries or Insights to store data that adheres to a PropertyDefinition.
"""
type PropertyValue {
  """
  Must match a 'key' in the corresponding PropertyDefinition.
  """
  key: String!
  """
  Populated if dataType is STRING, DATE, or ENUM_SELECT.
  """
  valueString: String
  """
  Populated if dataType is NUMBER.
  """
  valueNumber: Float
  """
  Populated if dataType is BOOLEAN.
  """
  valueBoolean: Boolean
}

"""
Standard error response object for partial mutation failures.
"""
type UserError {
  message: String!
  code: String!
  field: [String]
}

"""
User profile information.
"""
type UserProfile {
  id: ID!
  tenantId: ID!
  username: String
  groups: [String]
  email: AWSEmail
  isStripeConnected: Boolean
}

# ----------------------------------------------------------------------
# 5. INPUTS
# ----------------------------------------------------------------------

"""
Input for defining a dynamic schema property.
"""
input PropertyDefinitionInput {
  key: String!
  label: String!
  dataType: PropertyType!
  isRequired: Boolean!
  description: String
}

"""
Input for storing a dynamic property value.
"""
input PropertyValueInput {
  key: String!
  valueString: String
  valueNumber: Float
  valueBoolean: Boolean
}

"""
Filter input utilizing OneOf to enforce mutual exclusivity.
"""
input ProjectFilterInput @oneOf {
  byStatus: ProjectStatus
  byNameContains: String
}

input ProjectSortInput {
  field: ProjectSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input WorkflowFilterInput {
  nameContains: String
}

input WorkflowSortInput {
  field: WorkflowSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input DashboardSortInput {
  field: DashboardSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input MarketplaceSortInput {
  field: MarketplaceSortField = INSTALLS
  direction: SortDirection = DESC
}

input ShareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
  permission: SharePermission!
}

input UnshareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
}

input InsightFilterInput {
  visibility: InsightVisibility
  sourceTemplateId: ID
  sourceWorkflowId: ID
  tag: [String!]
  minConfidence: Float
  createdAfter: AWSDateTime
  pageNumber: Int
}

