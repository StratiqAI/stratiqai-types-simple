  GEMINI_3_1_FLASH_PREVIEW
  GEMINI_3_PRO_PREVIEW
  GEMINI_3_FLASH_PREVIEW
  GEMINI_2_5_FLASH
  GEMINI_2_5_FLASH_LITE
  GEMINI_2_5_PRO
}

"""
Execution outcome for AIQueryExecution (distinct from AIQueryStatus).
"""
enum ExecutionStatus {
  PENDING
  PROCESSING
  SUCCESS
  ERROR
}

# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

interface Node {
  id: ID!
}

interface Metadata {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

interface Storable {
  s3Bucket: String!
  s3Key: String!
}

# ----------------------------------------------------------------------
# 4. BASE ENTITY TYPES
# ----------------------------------------------------------------------

"""
Composite Key for accessing Child Entities (Doclink, Topic, Image, Table, Text, Scan).
Required because we do not have a Global Lookup GSI for children;
we must know the parentId to locate the item in the Main Table.
"""
input CompositeKeyInput {
  id: ID!
  parentId: ID!
}

