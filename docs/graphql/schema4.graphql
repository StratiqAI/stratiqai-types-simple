schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ----------------------------------------------------------------------
# 1. SCALARS & ENUMS
# ----------------------------------------------------------------------

scalar AWSDateTime
scalar AWSJSON

enum EntityType {
  # --- AppTable Entities ---
  PROJECT
  DOCLINK
  TOPIC
  WORKFLOW
  DASHBOARD
  RESOURCE_SHARE
  PRODUCT_LISTING
  PRODUCT_VERSION
  SUBSCRIPTION
  USER_PROFILE

  # --- ContentStore Entities ---
  DOCUMENT
  PAGE
  IMAGE
  TABLE
  CHART
  TEXT

  # --- AI Entities ---
  INSIGHT
  INSIGHT_REACTION
  INSIGHT_VERSION
  AI_JOB
}

enum PermissionScope {
  PRIVATE
  TENANT
  SYSTEM
}

enum ListScope {
  OWNED_BY_ME
  SHARED_WITH_ME
  ALL_TENANT # Admin view
}

# --- STATUS ENUMS ---

enum ProjectStatus {
  ACTIVE
  ARCHIVED
  DELETED
}

enum DocLinkStatus {
  notUploaded
  uploaded
  processing
  ready
  failed
}

enum SubscriptionStatus {
  ACTIVE
  PAST_DUE
  CANCELED
  EXPIRED
}

enum AIJobStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

# --- UX ENUMS ---

enum PresenceAction {
  VIEWING
  TYPING
  EDITING
  IDLE
}

enum SortDirection {
  ASC
  DESC
}

enum ProjectSortField {
  UPDATED_AT
  NAME
}

# --- SHARING & VISIBILITY ---

enum SharingMode {
  PRIVATE # Only Owner
  SPECIFIC_USERS # Owner + specific ResourceShare records
  TENANT_VIEW # All Tenant members can Read
  TENANT_EDIT # All Tenant members can Edit
}

enum SharePermission {
  VIEW # Read Only
  EDIT # Read & Write
  ADMIN # Read, Write, Delete, Share
}

enum InsightVisibility {
  PROJECT_PRIVATE # Visible only to Project members
  DOCUMENT_PUBLIC # Visible to anyone with the Document Link
}

enum InsightReactionType {
  THUMBS_UP
  THUMBS_DOWN
  STAR
  BOOKMARK
  FLAG
}

# ----------------------------------------------------------------------
# 2. COMMON OBJECTS
# ----------------------------------------------------------------------

type UserError {
  message: String!
  code: String!
  field: [String]
}

type ResourcePermissions {
  canEdit: Boolean!
  canDelete: Boolean!
  canShare: Boolean!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type UserProfile {
  id: ID!
  tenantId: ID!
  username: String
  groups: [String]
  email: String
}

# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

"""
The Standard Node. Every persistent item implements this.
"""
interface SystemNode {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!

  # Lifecycle (Trash Bin / Soft Delete)
  deletedAt: AWSDateTime
  ttl: Int

  # Lineage (Copy-on-Write)
  forkedFromId: ID
  forkedFromVersion: String

  permissions: ResourcePermissions!
}

interface Paginate {
  id: ID!
  updatedAt: AWSDateTime!
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

interface LicensedItem {
  subscriptionId: ID
  isLocked: Boolean!
}

"""
Items that are physically stored in AWS S3 (ContentStore).
"""
interface Storable {
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int
}

"""
Child elements extracted from a document page (OCR Data).
"""
interface DocumentElement {
  pageNumber: Int!
  boundingBox: [Float] # [x, y, width, height]
  confidence: Float
}

# ----------------------------------------------------------------------
# 4. STANDARDIZED INPUTS
# ----------------------------------------------------------------------

input PrimaryKeyInput {
  id: ID!
}

input ParentKeyInput {
  parentId: ID!
}

input CompositeKeyInput {
  id: ID!
  parentId: ID!
}

input PaginateInput {
  first: Int
  after: String
  last: Int
  before: String
}

input ForkEntityInput {
  sourceKey: CompositeKeyInput!
  targetScope: PermissionScope!
  name: String
  description: String
}

input ShareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
  permission: SharePermission!
}

input UnshareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
}

# ----------------------------------------------------------------------
# 5. CONTENT STORE ENTITIES (System Owned / Read Only)
# ----------------------------------------------------------------------

type Document implements SystemNode & Storable
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
  # SystemNode
  id: ID! # PK: DOC#<SHA256>
  entityType: EntityType!
  tenantId: ID! # Always "SYSTEM"
  ownerId: ID! # Always "SYSTEM"
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!

  # Storable
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int

  # Metadata
  docHash: String!
  pageCount: Int!
  language: String

  # Children Collections (Adjacency Fetch via ContentStore)
  pages(limit: Int, nextToken: String): DocumentPageConnection
  images(limit: Int, nextToken: String): DocumentImageConnection
  tables(limit: Int, nextToken: String): DocumentTableConnection
  charts(limit: Int, nextToken: String): DocumentChartConnection
}

