type Query {
  # DOCUMENT QUERIES
  getDocument(id: ID!): Document
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )
  listDocuments(limit: Int, nextToken: String): DocumentConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  # PROJECT QUERIES
  getProject(id: ID!): Project
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )
  listProjects(
    scope: ListScope = OWNED_BY_ME
    limit: Int
    nextToken: String
  ): ProjectConnection!
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  Get a single Doclink. Requires composite key (ID + ParentID) for access.
  """
  getDoclink(key: CompositeKeyInput!): Doclink

  """
  List Doclinks for a specific Project. Uses GSI1 (The View).
  """
  listDoclinks(
    parentId: ID! # Required: Cannot list "all docs in tenant" efficiently
    limit: Int
    nextToken: String
  ): DoclinkConnection!

  """
  Get a single Notification. Requires composite key (ID + ParentID) for access.
  """
  getNotification(key: CompositeKeyInput!): Notification
    @aws_iam
    @aws_cognito_user_pools(
      cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
    )

  """
  List Notifications for a specific Project. Uses GSI1 (The View).
  """
  listNotifications(
    parentId: ID! # Required: Cannot list "all notifications in tenant" efficiently
    limit: Int
    nextToken: String
