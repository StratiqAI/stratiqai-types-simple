type WorkflowExecution implements Node & Metadata
  @aws_iam
  @aws_cognito_user_pools {

  # Metadata Fields
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime

  # Parent Relationship
  parentId: ID!
  project: Project

  # Workflow Execution Fields
  workflowId: ID!
  workflow: Workflow
  status: WorkflowExecutionStatus!
  startedAt: AWSDateTime
  completedAt: AWSDateTime
  cancelledAt: AWSDateTime

  # Execution Context
  triggerEvent: AWSJSON
  inputData: AWSJSON
  outputData: AWSJSON
  errorMessage: String

  # Progress Tracking
  totalNodes: Int
  completedNodes: Int
  currentNodeId: String

  # Node Executions
  nodeExecutions(limit: Int, nextToken: String): WorkflowNodeExecutionConnection
  workflownodeexecutions(limit: Int, nextToken: String): WorkflowNodeExecutionConnection @deprecated(reason: "Use nodeExecutions instead")
}

type WorkflowExecutionConnection
  @aws_iam
  @aws_cognito_user_pools(
    cognito_groups: ["SystemAdmins", "TenantAdmins", "Users"]
  ) {
