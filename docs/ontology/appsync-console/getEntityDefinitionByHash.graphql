query GetEntityDefinitionByHash($projectId: ID!, $structuralHash: String!) {
  getEntityDefinitionByHash(projectId: $projectId, structuralHash: $structuralHash) {
    projectId
    id
    name
    description
    jsonSchema
    structuralHash
    normalizedJsonSchema
    properties {
      name
      description
      dataType
      path
      isList
      formula
      dependencies
    }
  }
}
