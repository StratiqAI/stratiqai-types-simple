schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ----------------------------------------------------------------------
# 1. SCALARS
# ----------------------------------------------------------------------
# AppSync native scalars (definitions required for linting/codegen, 
# but AppSync provides the logic internally)
scalar AWSDateTime
scalar AWSJSON
scalar AWSURL
scalar AWSEmail
scalar AWSIPAddress

# ----------------------------------------------------------------------
# 2. ENUMS
# ----------------------------------------------------------------------

enum EntityType {
  PROJECT
  DOCLINK
  TOPIC
  TOPIC_ENTRY
  WORKFLOW
  DASHBOARD
  DASHBOARD_WIDGET
  PROMPT_TEMPLATE
  RESOURCE_SHARE
  SUBSCRIPTION
  USER_PROFILE
  MARKETPLACE_PRODUCT
  MARKETPLACE_PRODUCT_VERSION
  PRODUCT_INSTALLATION
  PRODUCT_REVIEW
  USAGE_RECORD
  BILLING_INVOICE
  DOCUMENT
  PAGE
  IMAGE
  TABLE
  CHART
  TEXT
  INSIGHT
  INSIGHT_REACTION
  INSIGHT_VERSION
  AI_JOB
  MESSAGE
}

enum PermissionScope {
  PRIVATE
  TENANT
  SYSTEM
}

enum ListScope {
  OWNED_BY_ME
  SHARED_WITH_ME
  ALL_TENANT
}

enum ProjectStatus {
  ACTIVE
  ARCHIVED
  DELETED
}

enum DocLinkStatus {
  NOT_UPLOADED
  UPLOADED
  PROCESSING
  READY
  FAILED
}

enum SubscriptionStatus {
  ACTIVE
  PAST_DUE
  CANCELED
  EXPIRED
}

enum AIJobStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

enum PresenceAction {
  VIEWING
  TYPING
  EDITING
  IDLE
}

enum DashboardWidgetType {
  INSIGHT_FEED
  CHART
  TABLE
  KPI_CARD
  RICH_TEXT
  TOPIC_SUBSCRIBER
}

enum SharingMode {
  PRIVATE
  SPECIFIC_USERS
  TENANT_VIEW
  TENANT_EDIT
}

enum SharePermission {
  VIEW
  EDIT
  ADMIN
}

enum InsightVisibility {
  PROJECT_PRIVATE
  DOCUMENT_PUBLIC
}

enum InsightReactionType {
  THUMBS_UP
  THUMBS_DOWN
  STAR
  BOOKMARK
  FLAG
}

enum UsageUnit {
  TOKENS
  DURATION_SECONDS
  API_CALLS
}

enum BillingPeriod {
  MONTHLY
  QUARTERLY
  ANNUAL
}

enum InvoiceStatus {
  DRAFT
  OPEN
  PAID
  VOID
  UNCOLLECTIBLE
}

enum ProductVisibility {
  PRIVATE
  TENANT
  PUBLIC
}

enum ProductRevenueModel {
  FREE
  ONE_TIME
  SUBSCRIPTION
  PAY_PER_USE
}

enum MarketplaceSortField {
  INSTALLS
  RATING
  CREATED_AT
}

enum SortDirection {
  ASC
  DESC
}

enum ProjectSortField {
  NAME
  UPDATED_AT
  CREATED_AT
}

enum WorkflowSortField {
  NAME
  UPDATED_AT
}

enum DashboardSortField {
  TITLE
  UPDATED_AT
}

# ----------------------------------------------------------------------
# 3. INTERFACES
# ----------------------------------------------------------------------

interface SystemNode {
  id: ID!
  entityType: EntityType!
  tenantId: ID!
  ownerId: ID!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  deletedAt: AWSDateTime
  ttl: Int
  forkedFromId: ID
  forkedFromVersion: String
  permissions: ResourcePermissions!
}

interface Paginate {
  id: ID!
  updatedAt: AWSDateTime!
}

interface Shareable {
  sharingMode: SharingMode!
  accessList(limit: Int, nextToken: String): ResourceShareConnection
}

interface LicensedItem {
  subscriptionId: ID
  isLocked: Boolean!
}

interface Storable {
  s3Bucket: String!
  s3Key: String!
  mimeType: String!
  sizeBytes: Int
}

interface DocumentElement {
  pageNumber: Int!
  boundingBox: [Float]
  confidence: Float
}

# ----------------------------------------------------------------------
# 4. COMMON OBJECTS
# ----------------------------------------------------------------------

type UserError {
  message: String!
  code: String!
  field: [String]
}

type ResourcePermissions {
  canEdit: Boolean!
  canDelete: Boolean!
  canShare: Boolean!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type UserProfile {
  id: ID!
  tenantId: ID!
  username: String
  groups: [String]
  email: AWSEmail
  isStripeConnected: Boolean
}

# ----------------------------------------------------------------------
# 5. INPUTS
# ----------------------------------------------------------------------

input PrimaryKeyInput {
  id: ID!
}

input ParentKeyInput {
  parentId: ID!
}

input CompositeKeyInput {
  id: ID!
  parentId: ID!
}

input PaginateInput {
  first: Int
  after: String
  last: Int
  before: String
}

input ForkEntityInput {
  sourceKey: CompositeKeyInput!
  targetScope: PermissionScope!
  name: String
  description: String
}

input ShareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
  permission: SharePermission!
}

input UnshareResourceInput {
  resourceId: ID!
  recipientUserId: ID!
}

input ProjectSortInput {
  field: ProjectSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input ProjectFilterInput {
  status: ProjectStatus
  nameContains: String
}

input WorkflowFilterInput {
  nameContains: String
}

input WorkflowSortInput {
  field: WorkflowSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input DashboardSortInput {
  field: DashboardSortField = UPDATED_AT
  direction: SortDirection = DESC
}

input MarketplaceSortInput {
  field: MarketplaceSortField = INSTALLS
  direction: SortDirection = DESC
}

