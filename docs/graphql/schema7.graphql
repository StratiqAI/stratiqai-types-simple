# ----------------------------------------------------------------------
# 17. QUERY ROOT
# ----------------------------------------------------------------------

type Query {
  """
  Returns the profile of the currently authenticated user.
  """
  me: UserProfile
  
  """
  Global Object Identification lookup.
  """
  node(id: ID!): Node

  # --- Projects ---
  project(id: ID!): Project
  
  projects(
    scope: ListScope = OWNED_BY_ME
    filter: ProjectFilterInput
    sort: ProjectSortInput
    limit: Int
    nextToken: String
  ): ProjectConnection!

  # --- Sharing ---
  sharedWithMe(limit: Int, nextToken: String): ResourceShareConnection
    @aws_auth(cognito_groups: ["Users", "TenantAdmins"])

  # --- Child Items ---
  """
  DocLinks are child resources. The backend handles the composite key lookup via ID.
  """
  docLink(id: ID!): DocLink
  
  docLinks(
    parentId: ID!
    limit: Int
    nextToken: String
  ): DocLinkConnection
  
  topics(
    parentId: ID!
    limit: Int
    nextToken: String
  ): TopicConnection

  # --- AI ---
  insight(id: ID!): AIInsight
  
  projectInsights(
    projectId: ID!
    filter: InsightFilterInput
    limit: Int
    nextToken: String
  ): AIInsightConnection!
  
  documentInsights(
    documentId: ID!
    limit: Int
    nextToken: String
  ): AIInsightConnection!

  # --- Assets ---
  workflow(id: ID!): Workflow
  
  workflows(
    scope: ListScope = OWNED_BY_ME
    filter: WorkflowFilterInput
    sort: WorkflowSortInput
    limit: Int
    nextToken: String
  ): WorkflowConnection!

  dashboard(id: ID!): Dashboard
  
  dashboards(
    scope: ListScope = OWNED_BY_ME
    sort: DashboardSortInput
    limit: Int
    nextToken: String
  ): DashboardConnection!
  
  promptTemplate(id: ID!): PromptTemplate

  # --- Marketplace & Billing ---
  marketplaceProducts(
    search: String
    category: String
    tag: [String!]
    sort: MarketplaceSortInput
    limit: Int
    nextToken: String
  ): MarketplaceProductConnection!

  myProductInstallations(
    limit: Int
    nextToken: String
  ): ProductInstallationConnection!
  
  previewProductVersion(versionId: ID!): PreviewSandboxPayload

  myBillingSummary: BillingSummary!
  
  usageRecords(
    subscriptionId: ID!
    limit: Int
    nextToken: String
  ): UsageRecordConnection!
  
  billingInvoices(
    subscriptionId: ID!
    status: [InvoiceStatus!]
    limit: Int
    nextToken: String
  ): BillingInvoiceConnection!

  # --- Admins ---
  document(id: ID!): Document @aws_auth(cognito_groups: ["SystemAdmins"])
}

# ----------------------------------------------------------------------
# 18. MUTATION ROOT
# ----------------------------------------------------------------------

type ForkEntityPayload {
  node: Node
  userErrors: [UserError!]!
}

type Mutation {
  # --- Projects ---
  createProject(input: CreateProjectInput!): ProjectPayload
  updateProject(id: ID!, input: UpdateProjectInput!): ProjectPayload
  deleteProject(id: ID!): ProjectPayload
  restoreProject(id: ID!): ProjectPayload

  # --- Sharing ---
  shareResource(input: ShareResourceInput!): ResourceShare
    @aws_auth(cognito_groups: ["Users", "TenantAdmins"])
  unshareResource(input: UnshareResourceInput!): Boolean
    @aws_auth(cognito_groups: ["Users", "TenantAdmins"])

  # --- DocLinks ---
  createDocLink(
    parentId: ID!
    input: CreateDocLinkInput!
  ): DocLinkPayload
  updateDocLink(id: ID!, input: UpdateDocLinkInput!): DocLinkPayload
  deleteDocLink(id: ID!): DocLinkPayload

  # --- Topics & Live Feed ---
  createTopic(parentId: ID!, input: CreateTopicInput!): TopicPayload
  updateTopic(id: ID!, input: UpdateTopicInput!): TopicPayload
  deleteTopic(id: ID!): TopicPayload

  publishInsightToTopic(
    insightId: ID!
    topicId: ID!
    dataProperties: [PropertyValueInput!]
    clientMutationId: ID
  ): TopicEntryPayload @aws_iam
  
  publishToTopic(
    topicId: ID!
    dataProperties: [PropertyValueInput!]
    tags: [String!]
    clientMutationId: ID
  ): TopicEntryPayload

  # --- AI ---
  createSystemInsight(input: CreateSystemInsightInput!): AIInsightPayload
    @aws_iam
  createUserInsight(input: CreateUserInsightInput!): AIInsightPayload
  reactToInsight(
    insightId: ID!
    reaction: InsightReactionType!
    comment: String
  ): InsightReactionPayload

  # --- Assets ---
  createWorkflow(input: CreateWorkflowInput!): WorkflowPayload
  updateWorkflow(id: ID!, input: UpdateWorkflowInput!): WorkflowPayload
  deleteWorkflow(id: ID!): WorkflowPayload

  createDashboard(input: CreateDashboardInput!): DashboardPayload
  updateDashboard(id: ID!, input: UpdateDashboardInput!): DashboardPayload
  deleteDashboard(id: ID!): DashboardPayload

  createDashboardWidget(
    dashboardId: ID!
    input: CreateDashboardWidgetInput! # Uses @oneOf
  ): DashboardWidgetPayload
  
  updateDashboardWidget(
    id: ID!
    input: UpdateDashboardWidgetInput!
  ): DashboardWidgetPayload
  
  deleteDashboardWidget(id: ID!): DashboardWidgetPayload
  
  createPromptTemplate(input: CreatePromptTemplateInput!): PromptTemplate

  # --- Special ---
  forkEntity(
    sourceId: ID!
    targetScope: PermissionScope!
    name: String
  ): ForkEntityPayload

  # --- Marketplace ---
  createMarketplaceProduct(
    input: CreateProductInput!
    clientMutationId: ID
  ): MarketplaceProductPayload
  
  publishProductVersion(
    productId: ID!
    version: String!
    changelog: String
    includedAssetIds: [ID!]!
    priceMonthlyUsd: Float
    priceOneTimeUsd: Float
    clientMutationId: ID
  ): MarketplaceProductVersionPayload

  installProductVersion(
    versionId: ID!
    autoUpdate: Boolean = true
    clientMutationId: ID
  ): InstallProductPayload
  
  upgradeProductInstallation(
    installationId: ID!
    clientMutationId: ID
  ): InstallProductPayload

  # --- Billing & Stripe ---
  connectStripeAccount(code: String!): StripeConnectPayload
  
  createUsageRecord(
    input: CreateUsageRecordInput!
    clientMutationId: ID
  ): UsageRecordPayload @aws_iam
  
  publishUsageAlert(
    subscriptionId: ID!
    level: String!
    message: String!
    triggerRecordId: ID
  ): UsageAlertPayload @aws_iam

  createPaymentIntent(
    invoiceId: ID!
    clientMutationId: ID
  ): PaymentIntentPayload

  # Legacy/Admin Billing
  grantSubscription(
    targetUserId: ID!
    listingId: ID!
    durationDays: Int!
  ): TenantSubscriptionPayload @aws_auth(cognito_groups: ["SystemAdmins"])

  # --- Presence ---
  broadcastPresence(
    projectId: ID!
    action: PresenceAction!
    cursorX: Float
    cursorY: Float
  ): UserPresence
}

# ----------------------------------------------------------------------
# 19. SUBSCRIPTION ROOT
# ----------------------------------------------------------------------

type Subscription {
  # --- Standard CRUD ---
  onCreateProject(ownerId: ID, tenantId: ID): ProjectPayload
    @aws_subscribe(mutations: ["createProject"])
  onUpdateProject(id: ID!): ProjectPayload
    @aws_subscribe(mutations: ["updateProject", "restoreProject"])
  onDeleteProject(id: ID!): ProjectPayload
    @aws_subscribe(mutations: ["deleteProject"])

  onCreateDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["createDocLink"])
  onUpdateDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["updateDocLink"])
  onDeleteDocLink(parentId: ID!): DocLinkPayload
    @aws_subscribe(mutations: ["deleteDocLink"])

  onCreateWorkflow(ownerId: ID, tenantId: ID): WorkflowPayload
    @aws_subscribe(mutations: ["createWorkflow"])
  onUpdateWorkflow(id: ID!): WorkflowPayload
    @aws_subscribe(mutations: ["updateWorkflow"])
  onDeleteWorkflow(id: ID!): WorkflowPayload
    @aws_subscribe(mutations: ["deleteWorkflow"])

  onCreateDashboard(ownerId: ID, tenantId: ID): DashboardPayload
    @aws_subscribe(mutations: ["createDashboard"])
  onUpdateDashboard(id: ID!): DashboardPayload
    @aws_subscribe(mutations: ["updateDashboard"])
  onDeleteDashboard(id: ID!): DashboardPayload
    @aws_subscribe(mutations: ["deleteDashboard"])

  # --- AI / Topics ---
  onInsightCreatedInProject(projectId: ID!): AIInsightPayload
    @aws_subscribe(mutations: ["createSystemInsight", "createUserInsight"])
  onInsightCreatedForDocument(sourceDocumentId: ID!): AIInsightPayload
    @aws_subscribe(mutations: ["createSystemInsight"])

  onTopicEntryAdded(topicId: ID!): TopicEntryPayload
    @aws_subscribe(mutations: ["publishInsightToTopic", "publishToTopic"])
  
  onProjectTopicEntry(projectId: ID!): TopicEntryPayload
    @aws_subscribe(mutations: ["publishInsightToTopic", "publishToTopic"])

  # --- Ops ---
  onGrantSubscription(targetUserId: ID!): TenantSubscriptionPayload
    @aws_subscribe(mutations: ["grantSubscription"])
  onResourceShared(recipientUserId: ID!): ResourceShare
    @aws_subscribe(mutations: ["shareResource"])
  onResourceUnshared(recipientUserId: ID!): Boolean
    @aws_subscribe(mutations: ["unshareResource"])
  onPresenceChange(projectId: ID!): UserPresence
    @aws_subscribe(mutations: ["broadcastPresence"])

  # --- Billing Alerts ---
  onUsageThresholdExceeded(subscriptionId: ID!): UsageAlertPayload
    @aws_subscribe(mutations: ["publishUsageAlert"])
}