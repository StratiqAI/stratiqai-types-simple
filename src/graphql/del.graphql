      executionId: "1b7c4120-4b61-44c7-b26d-21e2330e44e3"
      promptId: "2b7c4120-4b61-44c7-b26d-21e2330e44e4"
      inputValues: "{}"
    }
  ) {
    id
    inputValues
    executionId
    promptId
    status
    candidatesTokenCount
    createdAt
    deletedAt
    documentIds
    durationMs
    entityType
    errorMessage
    executedAt
    ownerId
    projectId
    rawOutput
    promptTokenCount
    tenantId
